name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Se activa en cada push a la rama principal

jobs:
  # --- Primer Job: Correr Pruebas ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci # 'ci' es más rápido y seguro para pipelines

      - name: Run tests
        run: npm run test

  # --- Segundo Job: Desplegar (si las pruebas pasan) ---
  deploy:
    needs: test # Solo se ejecuta si el job 'test' fue exitoso
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Cambiar a tu región

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        run: |
          docker build -t mi-repositorio-ecr:latest .
          docker push mi-repositorio-ecr:latest

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster mi-cluster-ecs --service mi-servicio-ecs --force-new-deployment